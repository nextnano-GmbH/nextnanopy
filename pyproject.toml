[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextnanopy"
version = "1.3.1"
description = "Useful tools to interface the nextnano software (https://www.nextnano.com/)"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "nextnano GmbH", email = "python@nextnano.com" },
]
keywords = ["nextnano"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Customer Service",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
]
dependencies = [
    "numpy>=1.18",
    "pyvista>=0.27",
]

[project.optional-dependencies]
# Plotting helpers: nextnanopy.utils.plotting and DataFile.plot().
plot = ["matplotlib>=3.2", "cycler>=0.10"]
# GDS shape import: nextnanopy.shapes / nextnanopy.nnp.shapes. Needs the plot
# deps too, since shapes.py imports matplotlib and cycler at module level.
gds = ["nextnanopy[plot]", "gdspy>=1.6", "shapely>=1.7"]
# Post-processing: nextnanopy.postprocess (CV curves, minimization).
post = ["scipy>=1.7"]
# Every optional runtime feature.
all = ["nextnanopy[plot,gds,post]"]
# Development: everything optional plus the test runner and linter.
dev = ["nextnanopy[all]", "pytest>=7.0", "ruff>=0.15"]

[project.urls]
Homepage = "https://github.com/nextnano-GmbH/nextnanopy"

[tool.setuptools.packages.find]
include = ["nextnanopy*"]

[tool.setuptools.package-data]
"nextnanopy.utils.styles" = ["*.mplstyle"]
